name: 每日基金扫描
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      # tenacity: scripts/net.py 的退避重试后端(缺则自动回退内置实现)
      # 同样不做「A股休市日跳过」: monitor.html 里的 QQQ 卡/支撑位是美股数据, 休市日依旧会变。
      - run: pip install tenacity
      - name: 运行扫描
        run: python scripts/auto_scan_gh.py
      - name: 提交更新
        run: |
          git config user.name "auto-scan"
          git config user.email "auto-scan@users.noreply.github.com"
          git add monitor.html
          git diff --cached --quiet || (git commit -m "auto scan" && git push)
