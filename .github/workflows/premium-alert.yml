name: 溢价窗口提醒

# 场内纳指ETF「真实溢价」跌破阈值(<2%)时, 发邮件到 QQ 邮箱 — 零维护, 无需服务器
# (ntfy 通道 2026-09-12 已按要求关停; 恢复只需取消下面 NTFY_TOPIC 那行注释)
# 口径与 monitor.html 浏览器实时层一致(从线上页面取 FUND_META + 腾讯实时价 + QQQ 最新收盘校正)
on:
  schedule:
    - cron: '40 2 * * *'        # UTC 02:40 = 北京 10:40(A股开盘后, 美股休市口径稳定)
  workflow_dispatch:
    inputs:
      threshold:
        description: '触发阈值(%) — 想验证推送链路就填 99'
        default: '2'
        required: false

permissions:
  contents: read

concurrency:
  group: premium-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests tzdata
      - name: 检查真实溢价并推送(邮件)
        env:
          # NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # 2026-09-12 用户要求关停 ntfy, 只留邮件; 想恢复取消本行注释即可
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}   # QQ邮箱授权码(非登录密码); 未配置时邮件渠道自动跳过
          THRESHOLD: ${{ github.event.inputs.threshold || '2' }}
        run: python scripts/check_premium_window.py
